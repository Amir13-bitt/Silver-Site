name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Product photo cutouts (transparent backgrounds), made at build time.
      # If anything here fails, the site still deploys with the original photos.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore cutout model and finished cutouts
        uses: actions/cache@v4
        with:
          path: |
            ~/.rembg
            assets/products
          key: cutouts-${{ hashFiles('js/products.js', 'scripts/cutout_images.py', 'scripts/cutout_skip.txt', 'scripts/cutout_focus.txt') }}
          restore-keys: cutouts-
      - name: Remove photo backgrounds
        continue-on-error: true
        run: |
          pip install --quiet "rembg[cpu]==2.0.85" pillow
          python scripts/cutout_images.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
